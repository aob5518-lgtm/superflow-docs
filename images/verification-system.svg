  <text x="220" y="690" text-anchor="middle" fill="#A9C7FF" font-size="14" font-family="Arial">User readable proof</text>

  <rect x="390" y="635" width="220" height="72" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
  <text x="500" y="665" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial" font-weight="700">Verify Link</text>
