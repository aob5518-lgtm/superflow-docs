  <rect x="950" y="635" width="160" height="72" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
  <text x="1030" y="665" text-anchor="middle" fill="#FFFFFF" font-size="20" font-family="Arial" font-weight="700">Records</text>
  <text x="1030" y="690" text-anchor="middle" fill="#A9C7FF" font-size="14" font-family="Arial">History data</text>

  <path d="M435 575 C360 605 290 625 225 635" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>
  <path d="M535 575 C520 600 510 618 500 635" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>
  <path d="M665 575 C710 605 750 620 780 635" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>
  <path d="M765 575 C855 600 955 620 1030 635" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>

  <text x="600" y="735" text-anchor="middle" fill="#7FB2FF" font-size="16" font-family="Arial">
