  <text x="260" y="365" text-anchor="middle" fill="#A9C7FF" font-size="15" font-family="Arial">Order ID · Trade ID</text>

  <rect x="475" y="300" width="250" height="88" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
