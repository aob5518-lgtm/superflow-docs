<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="32" fill="#061A33"/>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D5FF"/>
      <stop offset="100%" stop-color="#0A5CFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="600" y="70" text-anchor="middle" fill="#FFFFFF" font-size="34" font-family="Arial" font-weight="700">
    SuperFlow Verification System
  </text>

  <text x="600" y="108" text-anchor="middle" fill="#A9C7FF" font-size="18" font-family="Arial">
    Trading Records · Yield Vouchers · Query Links · Verifiable Proof
  </text>

  <g filter="url(#glow)">
    <rect x="430" y="145" width="340" height="80" rx="24" fill="url(#blue)"/>
    <text x="600" y="178" text-anchor="middle" fill="#FFFFFF" font-size="22" font-family="Arial" font-weight="700">
      Execution Result
    </text>
    <text x="600" y="205" text-anchor="middle" fill="#EAF3FF" font-size="15" font-family="Arial">
