    </text>
  </g>

  <path d="M600 230 L600 275" stroke="#00D5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M590 264 L600 279 L610 264" stroke="#00D5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

