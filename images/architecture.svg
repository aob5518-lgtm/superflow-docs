<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="32" fill="#061A33"/>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D5FF"/>
      <stop offset="100%" stop-color="#0A5CFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="600" y="70" text-anchor="middle" fill="#FFFFFF" font-size="34" font-family="Arial" font-weight="700">
    SuperFlow Protocol System Architecture
  </text>

  <text x="600" y="108" text-anchor="middle" fill="#A9C7FF" font-size="18" font-family="Arial">
    AI-Driven Trading Operating System
  </text>

  <g opacity="0.18">
    <line x1="120" y1="160" x2="1080" y2="160" stroke="#5DA8FF"/>
    <line x1="120" y1="260" x2="1080" y2="260" stroke="#5DA8FF"/>
    <line x1="120" y1="360" x2="1080" y2="360" stroke="#5DA8FF"/>
    <line x1="120" y1="460" x2="1080" y2="460" stroke="#5DA8FF"/>
    <line x1="120" y1="560" x2="1080" y2="560" stroke="#5DA8FF"/>
  </g>

  <g filter="url(#glow)">
    <rect x="440" y="145" width="320" height="64" rx="18" fill="url(#blue)"/>
    <text x="600" y="184" text-anchor="middle" fill="#FFFFFF" font-size="22" font-family="Arial" font-weight="700">User Entrance</text>
  </g>

  <path d="M600 214 L600 250" stroke="#00D5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M590 240 L600 254 L610 240" stroke="#00D5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="270" width="250" height="92" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
  <text x="245" y="305" text-anchor="middle" fill="#FFFFFF" font-size="21" font-family="Arial" font-weight="700">Account System</text>
  <text x="245" y="335" text-anchor="middle" fill="#A9C7FF" font-size="15" font-family="Arial">Identity · Status · Permission</text>

  <rect x="475" y="270" width="250" height="92" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
  <text x="600" y="305" text-anchor="middle" fill="#FFFFFF" font-size="21" font-family="Arial" font-weight="700">Capital System</text>
  <text x="600" y="335" text-anchor="middle" fill="#A9C7FF" font-size="15" font-family="Arial">Capital · Cycle · Resource</text>

  <rect x="830" y="270" width="250" height="92" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
  <text x="955" y="305" text-anchor="middle" fill="#FFFFFF" font-size="21" font-family="Arial" font-weight="700">Risk Control</text>
  <text x="955" y="335" text-anchor="middle" fill="#A9C7FF" font-size="15" font-family="Arial">Limit · Protect · Monitor</text>

  <path d="M370 316 L470 316" stroke="#00D5FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M725 316 L825 316" stroke="#00D5FF" stroke-width="3" stroke-linecap="round"/>

  <path d="M600 365 L600 405" stroke="#00D5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M590 395 L600 409 L610 395" stroke="#00D5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#glow)">
    <rect x="390" y="415" width="420" height="96" rx="28" fill="url(#blue)"/>
    <text x="600" y="454" text-anchor="middle" fill="#FFFFFF" font-size="28" font-family="Arial" font-weight="700">SUPER AGENT</text>
    <text x="600" y="485" text-anchor="middle" fill="#EAF3FF" font-size="16" font-family="Arial">Decision Engine · Execution Scheduler · Risk System</text>
  </g>

  <path d="M600 515 L600 555" stroke="#00D5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M590 545 L600 559 L610 545" stroke="#00D5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="575" width="250" height="92" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
  <text x="245" y="610" text-anchor="middle" fill="#FFFFFF" font-size="21" font-family="Arial" font-weight="700">Smart Routing</text>
  <text x="245" y="640" text-anchor="middle" fill="#A9C7FF" font-size="15" font-family="Arial">Cost · Path · Depth</text>

  <rect x="475" y="575" width="250" height="92" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
  <text x="600" y="610" text-anchor="middle" fill="#FFFFFF" font-size="21" font-family="Arial" font-weight="700">Execution Layer</text>
  <text x="600" y="640" text-anchor="middle" fill="#A9C7FF" font-size="15" font-family="Arial">Order · Sync · Feedback</text>

  <rect x="830" y="575" width="250" height="92" rx="22" fill="#0B274D" stroke="#1E7BFF" stroke-width="2"/>
  <text x="955" y="610" text-anchor="middle" fill="#FFFFFF" font-size="21" font-family="Arial" font-weight="700">Verification System</text>
  <text x="955" y="640" text-anchor="middle" fill="#A9C7FF" font-size="15" font-family="Arial">Voucher · Record · Proof</text>

  <path d="M370 621 L470 621" stroke="#00D5FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M725 621 L825 621" stroke="#00D5FF" stroke-width="3" stroke-linecap="round"/>

  <text x="600" y="715" text-anchor="middle" fill="#7FB2FF" font-size="16" font-family="Arial">
    If Ethereum made value programmable, SuperFlow makes trading capability programmable.
  </text>
</svg>