    <line x1="100" y1="300" x2="1100" y2="300" stroke="#5DA8FF"/>
    <line x1="100" y1="430" x2="1100" y2="430" stroke="#5DA8FF"/>
    <line x1="100" y1="560" x2="1100" y2="560" stroke="#5DA8FF"/>
  </g>

  <g filter="url(#glow)">
