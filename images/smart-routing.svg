  <path d="M390 338 C260 340 180 370 175 450" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>
  <path d="M480 388 C430 410 405 425 400 450" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>
  <path d="M600 388 L625 450" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>
  <path d="M720 388 C800 410 840 425 850 450" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>
  <path d="M810 338 C950 350 1040 385 1050 450" stroke="#00D5FF" stroke-width="2" opacity="0.55"/>

  <text x="600" y="725" text-anchor="middle" fill="#7FB2FF" font-size="16" font-family="Arial">
